<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Six Feet Under the Table</title>
    <link rel="icon" href="data:," />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=IM+Fell+English+SC&family=Special+Elite&display=swap" rel="stylesheet" />
    <style>
      html, body {
        margin: 0;
        height: 100%;
        background: #000;
        overflow: hidden;
        font-family: "Special Elite", "Courier New", Courier, monospace;
        color: #d8cfb8;
        user-select: none;
      }
      #app canvas {
        display: block;
        width: 100vw;
        height: 100vh;
        image-rendering: pixelated;
        /* Tactile : pas de défilement ni de zoom pendant qu'on secoue le gobelet. */
        touch-action: none;
      }
      body.in-menu #ticket, body.in-menu #hint, body.in-menu #shop { display: none; }
      body.in-intro #ticket, body.in-intro #hint { display: none; }
      #validate.pulse { animation: pulse 1s ease-in-out infinite; }
      @keyframes pulse { 0%, 100% { box-shadow: 0 0 0 0 rgba(255, 204, 51, 0); } 50% { box-shadow: 0 0 0 4px rgba(255, 204, 51, 0.9); } }

      /* Menus : par-dessus la table, qu'on devine dans la pénombre. */
      #menu {
        position: fixed;
        inset: 0;
        display: none;
        align-items: center;
        justify-content: center;
        background: radial-gradient(ellipse at center, rgba(0, 0, 0, 0.55), rgba(0, 0, 0, 0.92));
        z-index: 8;
        overflow-y: auto;
      }
      #menu.show { display: flex; }
      #menu .panel { width: min(920px, calc(100vw - 32px)); padding: 24px 0; text-align: center; color: #d8cfb8; }
      #menu h1 {
        font-family: "IM Fell English SC", Georgia, serif;
        font-weight: normal;
        font-size: clamp(38px, 8vw, 80px);
        letter-spacing: 4px;
        line-height: 1.05;
        margin: 0 0 12px;
        color: #c8102e;
        text-shadow: 0 0 24px rgba(200, 16, 46, 0.6), 0 4px 0 #2a0408;
      }
      #menu h2 { font-family: "IM Fell English SC", Georgia, serif; font-weight: normal; font-size: 30px; letter-spacing: 3px; color: #e8dcc0; margin: 0 0 16px; text-shadow: 0 2px 0 #000; }
      #menu h3 { letter-spacing: 3px; color: #e8dcc0; margin: 18px 0 8px; font-size: 15px; }
      #menu .subtitle { font-style: italic; color: #9c927c; margin-bottom: 28px; }
      #menu .small { font-size: 12px; color: #7a7060; margin-top: 18px; }
      #menu button {
        font: inherit;
        padding: 9px 18px;
        background: linear-gradient(#2a1c14, #120a07);
        color: #e8dcc0;
        border: 1px solid #5a3a1e;
        box-shadow: inset 0 1px 0 rgba(255, 220, 180, 0.08), 0 2px 6px rgba(0, 0, 0, 0.6);
        cursor: pointer;
        transition: border-color 0.15s, color 0.15s, transform 0.15s, box-shadow 0.15s;
      }
      #menu button:hover:not(:disabled) { border-color: #f2c14e; color: #fff; transform: translateY(-1px); box-shadow: inset 0 1px 0 rgba(255, 220, 180, 0.12), 0 0 14px rgba(200, 16, 46, 0.35); }
      #menu button:disabled { opacity: 0.4; cursor: default; }
      #menu button.primary { background: linear-gradient(#a8261f, #6a120e); border-color: #c8102e; font-weight: bold; letter-spacing: 1px; }
      #menu button.on { border-color: #f2c14e; color: #f2c14e; }
      #menu .buttons { display: flex; flex-direction: column; gap: 10px; align-items: center; }
      #menu .buttons button { min-width: 240px; }
      #menu .row { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 20px; }
      #menu .langs { display: flex; gap: 8px; justify-content: center; margin: 14px 0; }
      #menu .warning .tag { font-size: 22px; letter-spacing: 6px; color: #c8102e; margin-bottom: 14px; }
      #menu .warning p { max-width: 560px; margin: 8px auto; }
      #menu .cups { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; }
      #menu .cup { display: flex; flex-direction: column; gap: 6px; text-align: left; padding: 12px; min-height: 96px; }
      #menu .cup span { font-size: 12px; color: #9c927c; }
      #menu .cup.selected { border-color: #f2c14e; background: #2a1a10; }
      #menu .cup .swatch { width: 26px; height: 8px; border: 1px solid #000; }
      #menu .stakes { display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; }
      #menu .stake { min-width: 42px; padding: 7px 0; }
      #menu .rules { list-style: none; padding: 0; margin: 10px 0 0; font-size: 13px; color: #c8a080; }
      #menu .relics { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 8px; text-align: left; }
      #menu .relic { display: flex; flex-direction: column; gap: 3px; padding: 9px; background: radial-gradient(ellipse at 30% 20%, #f0e8d2, #d8ccac); color: #1a1410; font-size: 12px; box-shadow: 0 3px 8px rgba(0, 0, 0, 0.5); }
      #menu .relic i { font-size: 11px; opacity: 0.7; }
      #menu .relic.locked, #menu .relic.unseen { background: #2a1e16; color: #7a6a58; }
      #menu .relic.rare { background: #e0c8c0; }
      #menu .relic.maudite { background: #c8a8a8; }
      #menu .registry { display: flex; gap: 40px; justify-content: center; flex-wrap: wrap; }
      #menu .registry .line { display: flex; justify-content: space-between; gap: 30px; min-width: 220px; padding: 4px 0; border-bottom: 1px dashed #3a2a1e; }
      #menu .registry b { color: #c8102e; }
      #menu .summary { max-width: 520px; margin: 0 auto; padding: 18px 22px; background: radial-gradient(ellipse at 30% 10%, #efe6cf, #d4c6a2); color: #1a1410; text-align: left; box-shadow: 0 10px 40px rgba(0, 0, 0, 0.8); transform: rotate(-0.6deg); }
      #menu .summary h2 { color: #6a0c0c; text-shadow: none; text-align: center; margin-bottom: 4px; }
      #menu .summary .cause { text-align: center; font-size: 13px; color: #4a3a2a; margin-bottom: 12px; }
      #menu .summary .line { display: flex; justify-content: space-between; gap: 20px; padding: 3px 0; border-bottom: 1px dashed #8a7a60; font-size: 14px; }
      #menu .summary .line b { color: #6a0c0c; }
      #menu .summary .relics-list { font-size: 12px; color: #3a2a1a; margin-top: 10px; }
      #menu .setting { display: flex; justify-content: space-between; align-items: center; gap: 16px; max-width: 560px; margin: 10px auto; text-align: left; }
      #menu .setting small { display: block; font-size: 11px; color: #7a7060; }
      #menu .setting .langs { margin: 0; }
      #menu input[type="range"] { width: 200px; accent-color: #c8102e; }
      #toast {
        position: fixed;
        right: 16px;
        bottom: 60px;
        padding: 10px 14px;
        background: rgba(20, 12, 8, 0.95);
        border: 1px solid #f2c14e;
        color: #f2c14e;
        font-size: 14px;
        opacity: 0;
        transform: translateY(10px);
        transition: opacity 0.3s, transform 0.3s;
        pointer-events: none;
        z-index: 9;
      }
      #toast.show { opacity: 1; transform: none; }
      /* HUD temporaire du prototype : sera remplacé par le ticket et les gravures en 3D. */
      #ticket {
        position: fixed;
        top: 16px;
        left: 16px;
        min-width: 240px;
        padding: 12px 14px;
        background: rgba(232, 224, 200, 0.92);
        color: #1a1410;
        font-size: 13px;
        line-height: 1.5;
        box-shadow: 0 6px 24px rgba(0, 0, 0, 0.6);
      }
      #ticket .row { display: flex; justify-content: space-between; gap: 16px; }
      #ticket .sep { border-top: 1px dashed #1a1410; margin: 6px 0; }
      #ticket .combo { font-weight: bold; }
      #ticket .detail { font-size: 12px; opacity: 0.8; }
      #validate {
        margin-top: 8px;
        width: 100%;
        padding: 6px;
        font: inherit;
        font-weight: bold;
        background: #1a1410;
        color: #e8e0c8;
        border: none;
        cursor: pointer;
      }
      #validate:disabled { opacity: 0.35; cursor: default; }
      #hint {
        position: fixed;
        bottom: 18px;
        left: 50%;
        transform: translateX(-50%);
        font-size: 14px;
        color: rgba(216, 207, 184, 0.75);
        text-shadow: 0 0 6px #000;
        pointer-events: none;
        text-align: center;
      }
      #banner {
        font-family: "IM Fell English SC", Georgia, serif;
        position: fixed;
        top: 38%;
        left: 50%;
        transform: translate(-50%, -50%);
        font-size: 34px;
        letter-spacing: 4px;
        color: #c8102e;
        text-shadow: 0 0 18px rgba(200, 16, 46, 0.7);
        pointer-events: none;
        opacity: 0;
        transition: opacity 0.4s;
        text-align: center;
      }
      #banner.show { opacity: 1; }
      #combo {
        font-family: "IM Fell English SC", Georgia, serif;
        position: fixed;
        top: 20%;
        left: 50%;
        transform: translate(-50%, -50%) scale(0);
        font-size: 40px;
        font-weight: bold;
        letter-spacing: 3px;
        text-transform: uppercase;
        color: #f2c14e;
        text-shadow: 0 0 14px rgba(242, 193, 78, 0.55), 0 3px 0 #2a0a04;
        pointer-events: none;
        text-align: center;
        opacity: 0;
      }
      #combo small { display: block; font-size: 16px; letter-spacing: 1px; color: #e8dcc0; margin-top: 4px; }
      #combo.pop { animation: combo-pop 2.2s cubic-bezier(0.2, 0.9, 0.3, 1.2) forwards; }
      @keyframes combo-pop {
        0% { opacity: 0; transform: translate(-50%, -50%) scale(0.3) rotate(-6deg); }
        14% { opacity: 1; transform: translate(-50%, -50%) scale(1.18) rotate(2deg); }
        24% { transform: translate(-50%, -50%) scale(1) rotate(0deg); }
        80% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
        100% { opacity: 0; transform: translate(-50%, -60%) scale(0.96); }
      }
      #tally {
        position: fixed;
        top: 16%;
        left: 50%;
        transform: translate(-50%, -50%);
        text-align: center;
        pointer-events: none;
        opacity: 0;
        transition: opacity 0.25s;
      }
      #tally.show { opacity: 1; }
      #tally .name { font-size: 22px; letter-spacing: 3px; text-transform: uppercase; color: #e8dcc0; text-shadow: 0 2px 0 #000; }
      #tally .boxes { display: flex; gap: 10px; align-items: center; justify-content: center; margin-top: 6px; }
      #tally .chips, #tally .mult {
        min-width: 90px;
        padding: 6px 12px;
        font-size: 30px;
        font-weight: bold;
        color: #fff;
        display: inline-block;
      }
      #tally .chips { background: #1f5a8c; box-shadow: 0 0 16px rgba(95, 168, 232, 0.5); }
      #tally .mult { background: #8c1f1a; box-shadow: 0 0 16px rgba(232, 72, 63, 0.5); }
      #tally .x { font-size: 26px; color: #e8dcc0; }
      #tally .total { font-size: 38px; font-weight: bold; color: #f2c14e; margin-top: 6px; min-height: 44px; text-shadow: 0 0 14px rgba(242, 193, 78, 0.6); }
      .bump { animation: bump 0.18s ease-out; }
      @keyframes bump { 0% { transform: scale(1.35); } 100% { transform: scale(1); } }
      #tooltip {
        position: fixed;
        max-width: 260px;
        padding: 8px 11px;
        background: radial-gradient(ellipse at 20% 0%, #f2e8cf, #d6c8a2);
        color: #1a1410;
        border-left: 3px solid #7a0c0c;
        box-shadow: 0 6px 18px rgba(0, 0, 0, 0.7);
        font-size: 13px;
        line-height: 1.35;
        pointer-events: none;
        display: none;
        z-index: 5;
      }
      #tooltip.show { display: block; }
      #tooltip b { color: #7a0c0c; }
      #tooltip i { color: #5a4a32; }
      #shop {
        position: fixed;
        left: 50%;
        top: 16px;
        transform: translateX(-50%);
        width: min(640px, calc(100vw - 32px));
        max-height: calc(100vh - 120px);
        overflow-y: auto;
        padding: 14px 18px;
        background: radial-gradient(ellipse at 25% 0%, #f2e8cf, #cfc09a);
        color: #1a1410;
        border: 1px solid #6a5434;
        box-shadow: 0 12px 40px rgba(0, 0, 0, 0.85), inset 0 0 30px rgba(90, 60, 20, 0.25);
        display: none;
        z-index: 4;
      }
      #shop.show { display: block; }
      #shop .head { display: flex; justify-content: space-between; font-family: "IM Fell English SC", Georgia, serif; font-size: 24px; letter-spacing: 2px; color: #6a0c0c; }
      #shop .coins { color: #7a4a06; }
      #shop .earn { font-size: 13px; color: #7a4a06; margin: 6px 0 2px; }
      #shop .sub { font-size: 13px; color: #4a3a26; margin: 12px 0 4px; }
      #shop .items { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 8px; }
      #shop .card {
        flex: 1 1 150px;
        max-width: 200px;
        padding: 8px;
        background: #f4ecd6;
        color: #1a1410;
        border: 1px solid #a8987a;
        display: flex;
        flex-direction: column;
        gap: 4px;
        font-size: 12px;
      }
      #shop .card.gravure { background: #c8c0e0; }
      #shop .card.sold { background: transparent; border: 1px dashed #5a3a1e; color: #5a3a1e; align-items: center; justify-content: center; }
      #shop .card .name { font-weight: bold; font-size: 14px; }
      #shop .card .rarity { font-size: 11px; opacity: 0.75; }
      #shop .rarity.peuCommune { color: #1f5a8c; opacity: 1; }
      #shop .rarity.rare { color: #8c1f1a; opacity: 1; font-weight: bold; }
      #shop .card .desc { flex: 1; }
      #shop .card .row { display: flex; gap: 4px; }
      #shop .empty { font-size: 12px; color: #6a5a4a; }
      #shop button {
        font: inherit;
        padding: 5px 8px;
        background: #1a1410;
        color: #e8e0c8;
        border: none;
        cursor: pointer;
      }
      #shop button:disabled { opacity: 0.35; cursor: default; }
      #shop .card .row button { flex: 1; }
      #shop .card.die { background: #d8d0b8; }
      #shop .card.burin { background: #e0c8a8; }
      #shop .card.maudite { background: #c8a8a8; }
      #shop .rarity.maudite { color: #5a0000; opacity: 1; font-weight: bold; }
      #shop .dice, #shop .faces { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 6px; }
      #shop .die-chip {
        display: flex;
        flex-direction: column;
        gap: 3px;
        padding: 6px 8px;
        background: #2a1a10;
        border: 1px solid #5a3a1e;
        color: #e8dcc0;
        font: inherit;
        font-size: 11px;
        text-align: left;
      }
      #shop button.die-chip { cursor: pointer; }
      #shop button.die-chip:hover { border-color: #f2c14e; }
      #shop .pips { display: flex; gap: 3px; }
      #shop .pip {
        width: 18px;
        height: 18px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        background: #d6ccae;
        color: #1a1410;
        font-weight: bold;
      }
      #shop .doree { outline: 2px solid #e8b830; }
      #shop .sanglante { outline: 2px solid #a01010; }
      #shop .vide { outline: 2px solid #000; background: #3a3a3a; color: #aaa; }
      #shop .clou { outline: 2px solid #8a8a90; }
      #shop .crane { outline: 2px solid #e0dcd0; }
      #shop .flamme { outline: 2px solid #ff6a10; }
      #shop .oeil { outline: 2px solid #d8e8f0; }
      #shop .jumelle { outline: 2px solid #c070c0; }
      #shop .faces button.face {
        width: 64px;
        height: 64px;
        font-size: 22px;
        font-weight: bold;
        background: #d6ccae;
        color: #1a1410;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
      }
      #shop .faces button.face small { font-size: 9px; }
      #shop .actions { display: flex; justify-content: space-between; margin-top: 14px; }
      #shop .actions button { padding: 8px 14px; background: #3a2214; }
      #shop .actions button.primary { background: #8c1f1a; font-weight: bold; }
      /* La coupure : noir total, un éclair rouge au moment de l'impact. */
      #blackout {
        position: fixed;
        inset: 0;
        background: #000;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.25s;
        z-index: 7;
      }
      #blackout.show { opacity: 1; pointer-events: auto; }
      #blackout.red { background: #6a0000; transition: none; }
      /* Sang projeté sur l'écran, qui s'efface lentement. */
      #bloodscreen {
        position: fixed;
        inset: 0;
        pointer-events: none;
        opacity: 0;
        z-index: 3;
        background:
          radial-gradient(circle at 12% 88%, rgba(90, 0, 0, 0.85) 0 9%, transparent 16%),
          radial-gradient(circle at 20% 72%, rgba(90, 0, 0, 0.7) 0 3%, transparent 6%),
          radial-gradient(circle at 86% 14%, rgba(90, 0, 0, 0.75) 0 6%, transparent 12%),
          radial-gradient(circle at 78% 26%, rgba(90, 0, 0, 0.6) 0 2%, transparent 4%),
          radial-gradient(ellipse at 50% 100%, rgba(60, 0, 0, 0.6), transparent 45%);
      }
      #bloodscreen.show { animation: blood 5s ease-out forwards; }
      @keyframes blood { 0% { opacity: 1; } 60% { opacity: 0.6; } 100% { opacity: 0; } }
      #ticket .boss { color: #7a0a0a; font-weight: bold; }
      #ticket .warn { color: #7a0a0a; }
      #banner small { display: block; font-size: 14px; letter-spacing: 1px; color: #d8cfb8; margin-top: 8px; }
      #loading { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: #000; color: #8a7a60; font: 14px "Courier New", monospace; letter-spacing: 4px; z-index: 50; }
      #loading span { animation: blink 1.2s steps(2) infinite; }
      #loading.error { color: #b03030; letter-spacing: 1px; padding: 24px; text-align: center; }
      @keyframes blink { 50% { opacity: 0.2; } }

      /* Téléphones et petites fenêtres : tout se resserre pour laisser voir la table. */
      @media (max-width: 900px), (max-height: 520px) {
        #menu .panel { padding: 10px 0; font-size: 13px; }
        #menu h1 { font-size: clamp(24px, 6vw, 40px); letter-spacing: 3px; margin-bottom: 6px; }
        #menu h2 { font-size: 16px; margin-bottom: 8px; }
        #menu h3 { font-size: 12px; margin: 10px 0 6px; }
        #menu .subtitle { margin-bottom: 12px; font-size: 12px; }
        #menu button { padding: 6px 10px; font-size: 12px; }
        #menu .buttons { gap: 6px; }
        #menu .buttons button { min-width: 180px; }
        #menu .row { margin-top: 10px; gap: 6px; }
        #menu .cups { grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 6px; }
        #menu .cup { padding: 7px; min-height: 0; }
        #menu .cup span { font-size: 10px; }
        #menu .stake { min-width: 30px; padding: 5px 0; }
        #menu .rules { font-size: 11px; }
        #menu .relics { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); }
        #menu .relic { font-size: 10px; padding: 6px; }
        #menu .registry { gap: 12px; }
        #menu .registry .line { min-width: 160px; padding: 2px 0; }
        #menu .setting { margin: 6px auto; gap: 10px; }
        #menu .warning .tag { font-size: 16px; }
        #menu .warning p { font-size: 12px; }
        #menu input[type="range"] { width: 130px; }
        #hint { font-size: 11px; bottom: 6px; width: 92vw; }
        #banner { font-size: 20px; letter-spacing: 2px; }
        #banner small { font-size: 11px; }
        #combo { font-size: 24px; }
        #combo small { font-size: 12px; }
        #tally .name { font-size: 14px; }
        #tally .chips, #tally .mult { min-width: 52px; padding: 3px 8px; font-size: 18px; }
        #tally .x { font-size: 16px; }
        #tally .total { font-size: 22px; min-height: 26px; }
        #tooltip { max-width: 210px; font-size: 11px; padding: 6px 8px; }
        #toast { font-size: 11px; bottom: 30px; }
        #shop { top: 6px; padding: 8px 10px; max-height: 32vh; width: min(520px, calc(100vw - 16px)); }
        #shop .head { font-size: 14px; letter-spacing: 2px; }
        #shop .earn, #shop .sub { font-size: 10px; margin: 4px 0 2px; }
        #shop .card { font-size: 10px; }
        #shop .card .name { font-size: 12px; }
        #shop button { padding: 4px 6px; font-size: 11px; }
        #shop .faces button.face { width: 46px; height: 46px; font-size: 16px; }
        #shop .actions { margin-top: 8px; }
        #shop .actions button { padding: 6px 10px; }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="ticket"></div>
    <div id="hint"></div>
    <div id="banner"></div>
    <div id="combo"></div>
    <div id="tally"></div>
    <div id="tooltip"></div>
    <div id="shop"></div>
    <div id="bloodscreen"></div>
    <div id="blackout"></div>
    <div id="menu"></div>
    <div id="toast"></div>
    <div id="loading"><span>LOADING</span></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
