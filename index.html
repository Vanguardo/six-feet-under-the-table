<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Six Feet Under the Table</title>
    <link rel="icon" href="data:," />
    <style>
      html, body {
        margin: 0;
        height: 100%;
        background: #000;
        overflow: hidden;
        font-family: "Courier New", Courier, monospace;
        color: #d8cfb8;
        user-select: none;
      }
      #app canvas {
        display: block;
        width: 100vw;
        height: 100vh;
        image-rendering: pixelated;
      }
      /* HUD temporaire du prototype : sera remplacé par le ticket et les gravures en 3D. */
      #ticket {
        position: fixed;
        top: 16px;
        left: 16px;
        min-width: 240px;
        padding: 12px 14px;
        background: rgba(232, 224, 200, 0.92);
        color: #1a1410;
        font-size: 13px;
        line-height: 1.5;
        box-shadow: 0 6px 24px rgba(0, 0, 0, 0.6);
      }
      #ticket .row { display: flex; justify-content: space-between; gap: 16px; }
      #ticket .sep { border-top: 1px dashed #1a1410; margin: 6px 0; }
      #ticket .combo { font-weight: bold; }
      #ticket .detail { font-size: 12px; opacity: 0.8; }
      #validate {
        margin-top: 8px;
        width: 100%;
        padding: 6px;
        font: inherit;
        font-weight: bold;
        background: #1a1410;
        color: #e8e0c8;
        border: none;
        cursor: pointer;
      }
      #validate:disabled { opacity: 0.35; cursor: default; }
      #hint {
        position: fixed;
        bottom: 18px;
        left: 50%;
        transform: translateX(-50%);
        font-size: 14px;
        color: rgba(216, 207, 184, 0.75);
        text-shadow: 0 0 6px #000;
        pointer-events: none;
        text-align: center;
      }
      #banner {
        position: fixed;
        top: 38%;
        left: 50%;
        transform: translate(-50%, -50%);
        font-size: 34px;
        letter-spacing: 4px;
        color: #c8102e;
        text-shadow: 0 0 18px rgba(200, 16, 46, 0.7);
        pointer-events: none;
        opacity: 0;
        transition: opacity 0.4s;
        text-align: center;
      }
      #banner.show { opacity: 1; }
      #combo {
        position: fixed;
        top: 20%;
        left: 50%;
        transform: translate(-50%, -50%) scale(0);
        font-size: 40px;
        font-weight: bold;
        letter-spacing: 3px;
        text-transform: uppercase;
        color: #f2c14e;
        text-shadow: 0 0 14px rgba(242, 193, 78, 0.55), 0 3px 0 #2a0a04;
        pointer-events: none;
        text-align: center;
        opacity: 0;
      }
      #combo small { display: block; font-size: 16px; letter-spacing: 1px; color: #e8dcc0; margin-top: 4px; }
      #combo.pop { animation: combo-pop 2.2s cubic-bezier(0.2, 0.9, 0.3, 1.2) forwards; }
      @keyframes combo-pop {
        0% { opacity: 0; transform: translate(-50%, -50%) scale(0.3) rotate(-6deg); }
        14% { opacity: 1; transform: translate(-50%, -50%) scale(1.18) rotate(2deg); }
        24% { transform: translate(-50%, -50%) scale(1) rotate(0deg); }
        80% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
        100% { opacity: 0; transform: translate(-50%, -60%) scale(0.96); }
      }
      #tally {
        position: fixed;
        top: 16%;
        left: 50%;
        transform: translate(-50%, -50%);
        text-align: center;
        pointer-events: none;
        opacity: 0;
        transition: opacity 0.25s;
      }
      #tally.show { opacity: 1; }
      #tally .name { font-size: 22px; letter-spacing: 3px; text-transform: uppercase; color: #e8dcc0; text-shadow: 0 2px 0 #000; }
      #tally .boxes { display: flex; gap: 10px; align-items: center; justify-content: center; margin-top: 6px; }
      #tally .chips, #tally .mult {
        min-width: 90px;
        padding: 6px 12px;
        font-size: 30px;
        font-weight: bold;
        color: #fff;
        display: inline-block;
      }
      #tally .chips { background: #1f5a8c; box-shadow: 0 0 16px rgba(95, 168, 232, 0.5); }
      #tally .mult { background: #8c1f1a; box-shadow: 0 0 16px rgba(232, 72, 63, 0.5); }
      #tally .x { font-size: 26px; color: #e8dcc0; }
      #tally .total { font-size: 38px; font-weight: bold; color: #f2c14e; margin-top: 6px; min-height: 44px; text-shadow: 0 0 14px rgba(242, 193, 78, 0.6); }
      .bump { animation: bump 0.18s ease-out; }
      @keyframes bump { 0% { transform: scale(1.35); } 100% { transform: scale(1); } }
      #tooltip {
        position: fixed;
        max-width: 260px;
        padding: 8px 10px;
        background: rgba(20, 12, 8, 0.95);
        border: 1px solid #6a4a2a;
        font-size: 13px;
        pointer-events: none;
        display: none;
        z-index: 5;
      }
      #tooltip.show { display: block; }
      #tooltip b { color: #f2c14e; }
      #shop {
        position: fixed;
        left: 50%;
        top: 16px;
        transform: translateX(-50%);
        width: min(640px, calc(100vw - 32px));
        max-height: calc(100vh - 120px);
        overflow-y: auto;
        padding: 14px 16px;
        background: rgba(28, 16, 10, 0.96);
        border: 2px solid #5a3a1e;
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.8);
        display: none;
        z-index: 4;
      }
      #shop.show { display: block; }
      #shop .head { display: flex; justify-content: space-between; font-size: 20px; letter-spacing: 3px; color: #e8dcc0; }
      #shop .coins { color: #f2c14e; }
      #shop .earn { font-size: 13px; color: #f2c14e; margin: 6px 0 2px; }
      #shop .sub { font-size: 13px; color: #9c927c; margin: 12px 0 4px; }
      #shop .items { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 8px; }
      #shop .card {
        flex: 1 1 150px;
        max-width: 200px;
        padding: 8px;
        background: #e8e0c8;
        color: #1a1410;
        display: flex;
        flex-direction: column;
        gap: 4px;
        font-size: 12px;
      }
      #shop .card.gravure { background: #c8c0e0; }
      #shop .card.sold { background: transparent; border: 1px dashed #5a3a1e; color: #5a3a1e; align-items: center; justify-content: center; }
      #shop .card .name { font-weight: bold; font-size: 14px; }
      #shop .card .rarity { font-size: 11px; opacity: 0.75; }
      #shop .rarity.peuCommune { color: #1f5a8c; opacity: 1; }
      #shop .rarity.rare { color: #8c1f1a; opacity: 1; font-weight: bold; }
      #shop .card .desc { flex: 1; }
      #shop .card .row { display: flex; gap: 4px; }
      #shop .empty { font-size: 12px; color: #6a5a4a; }
      #shop button {
        font: inherit;
        padding: 5px 8px;
        background: #1a1410;
        color: #e8e0c8;
        border: none;
        cursor: pointer;
      }
      #shop button:disabled { opacity: 0.35; cursor: default; }
      #shop .card .row button { flex: 1; }
      #shop .card.die { background: #d8d0b8; }
      #shop .card.burin { background: #e0c8a8; }
      #shop .card.maudite { background: #c8a8a8; }
      #shop .rarity.maudite { color: #5a0000; opacity: 1; font-weight: bold; }
      #shop .dice, #shop .faces { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 6px; }
      #shop .die-chip {
        display: flex;
        flex-direction: column;
        gap: 3px;
        padding: 6px 8px;
        background: #2a1a10;
        border: 1px solid #5a3a1e;
        color: #e8dcc0;
        font: inherit;
        font-size: 11px;
        text-align: left;
      }
      #shop button.die-chip { cursor: pointer; }
      #shop button.die-chip:hover { border-color: #f2c14e; }
      #shop .pips { display: flex; gap: 3px; }
      #shop .pip {
        width: 18px;
        height: 18px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        background: #d6ccae;
        color: #1a1410;
        font-weight: bold;
      }
      #shop .doree { outline: 2px solid #e8b830; }
      #shop .sanglante { outline: 2px solid #a01010; }
      #shop .vide { outline: 2px solid #000; background: #3a3a3a; color: #aaa; }
      #shop .clou { outline: 2px solid #8a8a90; }
      #shop .crane { outline: 2px solid #e0dcd0; }
      #shop .flamme { outline: 2px solid #ff6a10; }
      #shop .faces button.face {
        width: 64px;
        height: 64px;
        font-size: 22px;
        font-weight: bold;
        background: #d6ccae;
        color: #1a1410;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
      }
      #shop .faces button.face small { font-size: 9px; }
      #shop .actions { display: flex; justify-content: space-between; margin-top: 14px; }
      #shop .actions button { padding: 8px 14px; background: #3a2214; }
      #shop .actions button.primary { background: #8c1f1a; font-weight: bold; }
      /* La coupure : noir total, un éclair rouge au moment de l'impact. */
      #blackout {
        position: fixed;
        inset: 0;
        background: #000;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.25s;
        z-index: 7;
      }
      #blackout.show { opacity: 1; pointer-events: auto; }
      #blackout.red { background: #6a0000; transition: none; }
      /* Sang projeté sur l'écran, qui s'efface lentement. */
      #bloodscreen {
        position: fixed;
        inset: 0;
        pointer-events: none;
        opacity: 0;
        z-index: 3;
        background:
          radial-gradient(circle at 12% 88%, rgba(90, 0, 0, 0.85) 0 9%, transparent 16%),
          radial-gradient(circle at 20% 72%, rgba(90, 0, 0, 0.7) 0 3%, transparent 6%),
          radial-gradient(circle at 86% 14%, rgba(90, 0, 0, 0.75) 0 6%, transparent 12%),
          radial-gradient(circle at 78% 26%, rgba(90, 0, 0, 0.6) 0 2%, transparent 4%),
          radial-gradient(ellipse at 50% 100%, rgba(60, 0, 0, 0.6), transparent 45%);
      }
      #bloodscreen.show { animation: blood 5s ease-out forwards; }
      @keyframes blood { 0% { opacity: 1; } 60% { opacity: 0.6; } 100% { opacity: 0; } }
      #ticket .boss { color: #7a0a0a; font-weight: bold; }
      #ticket .warn { color: #7a0a0a; }
      #banner small { display: block; font-size: 14px; letter-spacing: 1px; color: #d8cfb8; margin-top: 8px; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="ticket"></div>
    <div id="hint"></div>
    <div id="banner"></div>
    <div id="combo"></div>
    <div id="tally"></div>
    <div id="tooltip"></div>
    <div id="shop"></div>
    <div id="bloodscreen"></div>
    <div id="blackout"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
